
services:
  - type: web
    name: mukando-api
    runtime: python

    buildCommand: pip install -r requirements.txt

    preDeployCommand: alembic upgrade head

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: ENVIRONMENT
        value: production

      - key: DATABASE_URL_PRODUCTION
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: JWT_PRIVATE_KEY
        sync: false

      - key: JWT_PUBLIC_KEY
        sync: false

